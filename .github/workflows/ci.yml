name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:check
      - run: git diff --exit-code -- packages/core/src/internal/wasm-binary.js

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  assistant-ui-demo:
    name: Assistant UI demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/assistant-ui-demo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the production demo in Chromium
        env:
          DEMO_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm exec -- vite preview --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "$DEMO_URL" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Demo preview did not become ready."
            exit 1
          fi
          node --test --test-concurrency=1 tests/*.test.mjs
