name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # ratchet:pnpm/setup@v3.2.0
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable 2026-11-15
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:check
      - run: git diff --exit-code -- packages/core/src/internal/wasm-binary.js

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # ratchet:pnpm/setup@v3.2.0
        with:
          runtime: node@22
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps "$STREAMFOLD_BROWSER"
        env:
          STREAMFOLD_BROWSER: ${{ matrix.browser }}
      - run: pnpm test:browser
        env:
          STREAMFOLD_BROWSER: ${{ matrix.browser }}

  node-20:
    name: Node.js 20 core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # ratchet:pnpm/setup@v3.2.0
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # ratchet:pnpm/setup@v3.2.0
        with:
          runtime: node@20
          install: false
      - run: node --test packages/core/src/*.test.js

  assistant-ui-demo:
    name: Assistant UI demo (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [published, candidate]
    defaults:
      run:
        working-directory: examples/assistant-ui-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # ratchet:pnpm/setup@v3.2.0
        with:
          runtime: node@24
          install: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable 2026-11-15
        if: matrix.package == 'candidate'
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Pack the candidate package
        if: matrix.package == 'candidate'
        working-directory: packages/core
        run: |
          mkdir "$RUNNER_TEMP/streamfold-candidate"
          npm pack --pack-destination "$RUNNER_TEMP/streamfold-candidate"
      - run: npm ci
      - name: Install the candidate package
        if: matrix.package == 'candidate'
        run: npm install --no-save --ignore-scripts "$RUNNER_TEMP"/streamfold-candidate/streamfold-*.tgz
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the production demo in Chromium
        env:
          DEMO_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm exec -- vite preview --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "$DEMO_URL" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Demo preview did not become ready."
            exit 1
          fi
          node --test --test-concurrency=1 tests/*.test.mjs
