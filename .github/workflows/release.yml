name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Install the npm publish client
        run: |
          pnpm add --global npm@11.15.0
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in origin/main."
            exit 1
          fi

          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "Streamfold must be public before publishing to npm with provenance."
            exit 1
          fi

          root_version="$(node -p "require('./package.json').version")"
          package_version="$(node -p "require('./packages/core/package.json').version")"
          if [ "$root_version" != "$package_version" ]; then
            echo "Root version $root_version does not match package version $package_version."
            exit 1
          fi

          release_tag="v$package_version"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual release retries must run from main."
              exit 1
            fi

            # Build the workflow's own commit so provenance describes the source
            # actually used. A retry may only publish unchanged tagged inputs.
            git rev-parse --verify "refs/tags/$release_tag^{commit}"
            git merge-base --is-ancestor "$release_tag" HEAD
            git diff --exit-code "$release_tag" HEAD -- \
              packages/core crates scripts package.json pnpm-lock.yaml \
              pnpm-workspace.yaml Cargo.toml Cargo.lock rust-toolchain.toml \
              LICENSE .cargo .npmrc .pnpmfile.cjs .gitattributes
          elif [ "$release_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

          if npm view "streamfold@$package_version" version >/dev/null 2>&1; then
            echo "streamfold@$package_version is already published; npm publish will be skipped."
            echo "NPM_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          else
            echo "NPM_ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

          if [[ "$package_version" == *-beta.* ]]; then
            echo "NPM_DIST_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Verify source and package
        run: pnpm check && pnpm pack:check

      - name: Publish to npm
        if: env.NPM_ALREADY_PUBLISHED != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/streamfold-publish.npmrc"
            umask 077
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
            trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          fi
          pnpm publish:npm --access public --tag "$NPM_DIST_TAG" --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            release_flags=()
            if [ "$NPM_DIST_TAG" = "beta" ]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "Streamfold $RELEASE_TAG" \
              "${release_flags[@]}"
          fi
